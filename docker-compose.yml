services:
  phenotyping:
    build: .
    container_name: multimodal-phenotyping
    ports:
      - "${MULTIMODE_PORT:-8501}:8501"
    environment:
      MULTIMODE_SOURCE: ${MULTIMODE_SOURCE:-real}
      MULTIMODE_DATA_ROOT: /data
      MULTIMODE_MODEL: ${MULTIMODE_MODEL:-ridge}
      MULTIMODE_TRAITS: ${MULTIMODE_TRAITS:-chlorophyll,LAI,water_content,biomass,soluble_solids}
    volumes:
      - ${MULTIMODE_DATA_DIR:-./data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
